<ion-content [fullscreen]="true" class="favorites-content">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mis Favoritos</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="favorites-grid" *ngIf="favorites.length > 0">
    <app-content-card
      *ngFor="let content of favorites"
      [content]="content"
      size="medium"
    ></app-content-card>
  </div>

  <div class="empty-state" *ngIf="favorites.length === 0">
    <ion-icon name="heart-outline"></ion-icon>
    <h3>No tienes favoritos aún</h3>
    <p>Agrega contenido a tu lista de favoritos para verlo aquí</p>
    <ion-button routerLink="/tabs/home" fill="outline">
      Explorar contenido
    </ion-button>
  </div>
</ion-content>
